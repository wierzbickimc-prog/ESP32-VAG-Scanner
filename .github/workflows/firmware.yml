# Builds the ESP32-P4 firmware on every change. On a published release it
# attaches the image to the release and starts pages.yml, which puts it behind
# the ESP Web Tools install button.
#
# The build includes the KW1281 fault type names (GPL-3.0, like this project)
# and never the Ross-Tech fault description table, which isn't ours to share.
name: Firmware

on:
  push:
    branches: [main]
    paths: ["esp32/**", "kwcore/**", "assets/**", "web/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["esp32/**", "kwcore/**", "assets/**", "web/**", ".github/workflows/firmware.yml"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test installer packaging
        run: python3 assets/tools/test_package_installer.py

      - name: Fetch the fault type names (GPL-3.0)
        run: python3 assets/tools/fetch_fault_types.py

      - name: Make sure the Ross-Tech table isn't in the build
        run: test ! -e ross-tech-fault-codes.csv

      - name: Build and merge into one image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32p4
          path: esp32
          command: idf.py build && idf.py merge-bin -o esp32-vag-scanner-p4.bin

      - name: Assemble the install page
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG:-dev-${GITHUB_SHA::7}}"
          mkdir -p site
          cp web/index.html site/
          cp esp32/build/esp32-vag-scanner-p4.bin site/
          python3 assets/tools/package_installer.py site/esp32-vag-scanner-p4.bin "$version" site
          echo "Firmware $version: $(stat -c %s site/esp32-vag-scanner-p4.bin) bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-vag-scanner-p4
          path: site/

  release:
    # Attach the image to the release, then publish the install page from main
    # (GitHub Pages only accepts deployments from the default branch).
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32-vag-scanner-p4

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" esp32-vag-scanner-p4.bin --clobber --repo "$GITHUB_REPOSITORY"
          gh workflow run pages.yml --ref main -f tag="$TAG" --repo "$GITHUB_REPOSITORY"
